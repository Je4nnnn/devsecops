name: ${COMPOSE_PROJECT_NAME:-vuln-app-wazuh}

services:
  db-api:
    image: ${DB_IMAGE:?Defina DB_IMAGE en .env}
    pull_policy: never
    command: ["postgres", "-c", "shared_preload_libraries=timescaledb"]
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Defina POSTGRES_DB en .env}
      POSTGRES_USER: ${POSTGRES_USER:?Defina POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env}
    volumes:
      - postgres_api_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  api:
    image: ${API_IMAGE:?Defina API_IMAGE en .env}
    pull_policy: never
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_HOST: db-api
      DATABASE_PORT: "5432"
      DATABASE_URL: ""
    depends_on:
      db-api:
        condition: service_healthy
    networks:
      - app-network
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/docs', timeout=5)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    image: ${FRONTEND_IMAGE:?Defina FRONTEND_IMAGE en .env}
    pull_policy: never
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${FRONTEND_HTTP_PORT:-18080}:80"
      - "${BIND_ADDRESS:-0.0.0.0}:${FRONTEND_HTTPS_PORT:-18443}:443"
    volumes:
      - ${TLS_CERT_DIR:-./nginx/ssl}:/etc/nginx/ssl:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      - app-network
    read_only: true
    tmpfs:
      - /var/cache/nginx:uid=101,gid=101
      - /run:uid=101,gid=101
      - /tmp:uid=101,gid=101
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    logging:
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_api_data:

networks:
  app-network:
    driver: bridge
